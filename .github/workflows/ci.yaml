# Continuous integration — thin caller for the org's reusable ci workflow (v7:
# installs the mise pins). It discovers the canonical tasks this repo defines
# and runs `mise run lint` (there is no build or test) — the repo-wide gates:
# chart manifest/allowlist lint, shellcheck, addlicense, actionlint + zizmor
# and prose. The deep per-chart pipeline (regeneration gate, provenance
# verification, scans) is pr-validate.yaml, which only runs when
# chart-affecting paths change.
#
# The reusable workflow is pinned to a full commit SHA (tag in the comment) so a
# moved tag can never change what runs; Renovate keeps the pin fresh.
name: Continuous Integration

on:
    push:
        branches: [main]
    pull_request:

# the reusable workflow's jobs only need contents:read; grant just that ceiling
permissions:
    contents: read

jobs:
    ci:
        uses: bitwise-media-group/github-workflows/.github/workflows/ci.yaml@fea4c5284a9d3679c64f0e2cac5810124e0294d2 # v7.0.0
