# Continuous integration — thin caller for the org's reusable ci workflow (v7:
# installs the mise pins). It discovers the canonical tasks this repo defines
# and runs `mise run <target>` for each: `lint` — the repo-wide gates:
# shellcheck, addlicense, actionlint + zizmor and prose — and `build`, the
# containers archetype's `patchy build --all --dry-run`, which succeeds with
# nothing to build here (the store has no build: entries). There is no `test`.
# The site is built by docs.yaml. The deep per-chart pipeline (regeneration gate,
# provenance verification, scans, manifest/allowlist lint) is pr-validate.yaml,
# which only runs when chart-affecting paths change and only on the entries
# the PR touches; rescan.yaml lints every entry weekly. Entry lint stays out of
# here because allowlist expiry would fail PRs that never touched the entry.
#
# The reusable workflow is pinned to a full commit SHA (tag in the comment) so a
# moved tag can never change what runs; Renovate keeps the pin fresh.
name: Continuous Integration

on:
    push:
        branches: [main]
    pull_request:

# the reusable workflow's jobs only need contents:read; grant just that ceiling
permissions:
    contents: read

jobs:
    ci:
        uses: bitwise-media-group/github-workflows/.github/workflows/ci.yaml@e4f48161b429020844ca246bb598b34ac2d330fd # v8.2.0
        with:
            # no unit tests here (there is no test task), so skip the
            # Codecov upload
            coverage: false
