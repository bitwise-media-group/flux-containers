# Continuous integration — thin caller for the org's reusable ci workflow (v7:
# installs the mise pins). It discovers the canonical tasks this repo defines
# and runs `mise run <target>` for each: `lint` — the repo-wide gates: chart
# manifest/allowlist lint, shellcheck, addlicense, actionlint + zizmor and
# prose — and `build`, which renders the documentation site (chart references
# + zensical), so a broken page fails the PR. `test` comes from the python
# archetype and skips (pytest is not a project dependency). The deep per-chart
# pipeline (regeneration gate, provenance verification, scans) is
# pr-validate.yaml, which only runs when chart-affecting paths change.
#
# The reusable workflow is pinned to a full commit SHA (tag in the comment) so a
# moved tag can never change what runs; Renovate keeps the pin fresh.
name: Continuous Integration

on:
    push:
        branches: [main]
    pull_request:

# the reusable workflow's jobs only need contents:read; grant just that ceiling
permissions:
    contents: read

jobs:
    ci:
        uses: bitwise-media-group/github-workflows/.github/workflows/ci.yaml@8b34c6fe87a61fc2f800876e9268bc1da8635e88 # v8.0.0
        with:
            # no unit tests here (the test task skips: pytest is not a
            # dependency), so skip the Codecov upload
            coverage: false
