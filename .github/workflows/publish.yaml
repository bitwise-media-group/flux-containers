# Publish — `patchy mirror sync` converges the platform Artifact Registry
# onto the merged tree: mirror the locked images (by digest) and the charts
# themselves, cosign-signing everything KEYLESSLY. The job's GitHub OIDC
# token mints both the GCP access token (via Workload Identity Federation,
# impersonating the chart-publisher service account the artifact-store
# terraform created) and the Fulcio signing certificate. Consumers pin this
# workflow's exact identity
# (…/flux-containers/.github/workflows/publish.yaml@refs/heads/main), which
# is why the job is hard-guarded to main: a dispatch from any other ref
# would mint a different certificate subject than the clusters verify.
#
# sync is idempotent per tag (an existing chart tag is never replaced;
# current-and-signed images are skipped), so it always runs over the whole
# store — no changed-entry detection needed for correctness, and a re-run
# after a partial failure finishes the remainder.
name: Publish Charts

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "artifacts/**"
      - "mirror.yaml"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      # WIF token exchange + cosign keyless both ride the job's OIDC token
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: install tools
        uses: ./.github/actions/pipeline-tools

      - name: authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          # artifact-store module outputs, mirrored as org-level Actions variables
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CHART_PUBLISHER_SA }}
          token_format: access_token

      - name: login to Artifact Registry
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          # One docker-keychain login covers everything patchy does: image
          # copies, chart pushes and cosign signing all read it.
          host="$(yq '.registry.url' mirror.yaml | cut -d/ -f1)"
          crane auth login "$host" --username oauth2accesstoken --password-stdin <<<"$ACCESS_TOKEN"

      - name: re-verify and publish
        run: |
          # Defense in depth: provenance is re-verified on main before
          # anything is pushed, so nothing merged around the PR gate gets
          # signed with the platform identity. -o markdown IS the job
          # summary — no parsing here.
          patchy mirror validate --all --only verify
          patchy mirror sync --all -o markdown | tee /tmp/sync.md

      - name: job summary
        if: always()
        run: |
          {
            echo "## Published"
            echo
            cat /tmp/sync.md 2>/dev/null || echo "(sync did not produce a report)"
          } >> "$GITHUB_STEP_SUMMARY"
