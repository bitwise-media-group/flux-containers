# Weekly rescan of every entry's published image set with a fresh
# vulnerability database — the feedback loop for CVEs published after merge.
# Never blocks anything: findings land as security-labelled issues, fixed by
# bumping the chart (new upstream images) or allowlisting with a statement
# and expiry. The lint stage runs alongside so allowlist entries nearing
# expiry surface here too.
#
# One `patchy mirror validate <entry> -o markdown` per entry: the exit code
# says whether the entry needs an issue, and the markdown IS the issue body
# — no JSON parsing anywhere.
name: Rescan Charts

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  rescan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: install tools
        uses: ./.github/actions/pipeline-tools

      - name: rescan all published image sets with a fresh DB
        id: scan
        run: |
          shopt -s nullglob
          failed=""
          for dir in charts/*/ artifacts/*/; do
            entry="$(basename "$dir")"
            echo "::group::$entry"
            if ! patchy mirror validate "$entry" --only scan,lint -o markdown > "/tmp/rescan-$entry.md"; then
              failed="$failed $entry"
            fi
            cat "/tmp/rescan-$entry.md"
            echo "::endgroup::"
          done
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"

      - name: open or update issues for new findings
        if: steps.scan.outputs.failed != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for entry in ${{ steps.scan.outputs.failed }}; do
            title="rescan: blocking vulnerabilities in $entry"
            body="$(printf 'Weekly rescan found blocking findings in already-published images.\n\n%s\n\nFix by bumping the chart (new upstream images) or allowlisting with a statement and expiry.\n' "$(cat "/tmp/rescan-$entry.md")")"
            existing="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$body"
            else
              gh issue create --title "$title" --body "$body" --label security
            fi
          done
