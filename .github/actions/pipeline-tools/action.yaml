name: pipeline-tools
description: Install the pinned mirror pipeline toolchain via mise (patchy, crane, grype, kubescape, yq, shellcheck, markdownlint-cli2)

# Tool versions come from the shared toolchain submodule at .mise/
# (config.toml + mise.lock): patchy, crane, yq, grype, kubescape, cosign,
# shellcheck and the prose tools. The pipeline tools are lazy pins, so
# `mise install` skips them and the shims install each one the first time a
# step runs it. patchy is the pipeline engine — `patchy mirror` carries the
# vendor/render/discover/verify/scan/publish machinery that used to be
# scripts/, with grype and kubescape the only remaining shell-outs. mise
# verifies every download against the lockfiles (plus cosign/SLSA/GitHub
# attestations where the publisher provides them), so no system Go or Node is
# needed anywhere. Callers must check out with `submodules: true` so .mise/
# exists. mise-action caches the tool store keyed on the pins and puts mise
# shims on PATH, so both `make <target>` (→ `mise run`) and direct `patchy`
# invocations get the pinned tools.
runs:
  using: composite
  steps:
    - name: Set up mise
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        # v-prefixed to match the release tag exactly -- Renovate resolves this
        # value against jdx/mise's release tags, and a bare 2026.11.4 404s (the tag
        # is v2026.11.4), failing the whole org bot run
        version: v2026.11.4
        # sha256 of the linux-x64 mise binary for the version above, from the
        # release's SHASUMS256.txt -- the action verifies the extracted binary,
        # not the archive. Keep in step with the org's reusable ci.yaml.
        sha256: 0296d9cba9324106d4e0962bb94a2072902f3658813aeb3b09504947bb8ddc2b
        install: false # trust explicitly first; the step below does the install

    - name: install pinned tools
      shell: bash
      env:
        # mise resolves aqua/ubi-backend releases via the GitHub API;
        # unauthenticated calls rate-limit on shared runners
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        mise trust --quiet mise.toml
        mise trust --quiet .mise/config.toml
        mise install
