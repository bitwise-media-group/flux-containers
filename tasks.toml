#
# Repo-local tasks, included after common and the containers archetype. The
# pipeline surface is the archetype's: mirror-add, mirror-check,
# mirror-upgrade, mirror-validate, mirror-lint and mirror-publish forward to
# `patchy mirror` over the entries ENTRY names (every entry when unset; `make
# mirror-upgrade ENTRY=dex`). Only the docs site and the local gate live here.

# The documentation site (zensical.toml + docs/, built with Zensical via uv).
# The chart reference pages embed fragments that scripts/chart_docs.py derives
# from the committed tree (manifests, image locks, allowlists, vendored
# values.yaml) into build/chart-docs/, so every docs entry point regenerates
# them first; the site can never describe a chart version the tree no longer
# pins. ci, pr and the docs workflow all build through docs-build.
[docs-gen]
hide = true
dir = "{{config_root}}"
run = ["uv sync", "uv run --no-sync python scripts/chart_docs.py"]

[docs-build]
description = "build the documentation site (chart references + zensical)"
dir = "{{config_root}}"
run = [{ task = "docs-gen" }, "uv run --no-sync zensical build"]

[serve]
description = "serve the docs site locally on :8003 (zensical)"
dir = "{{config_root}}"
run = [{ task = "docs-gen" }, "uv run --no-sync zensical serve"]

# The archetype's pr leaves the mirror out, because mirror-validate pulls every
# upstream chart and its lint is time-dependent (allowlist expiry). Locally,
# before a pull request, the whole store is exactly what should be proved:
# regenerate out-of-tree and demand byte-identity, verify upstream provenance,
# scan, lint. The reusable CI keeps to `ci` (lint, build, docs-build), and
# pr-validate runs the same validation on the entries a pull request changes.
[pr]
description = "full local gate before a pull request (the whole mirror pipeline + the docs site)"
run = [
  { task = "fmt" },
  { task = "lint" },
  { task = "mirror-validate" },
  { task = "build" },
  { task = "docs-build" },
  { task = "commit" },
]
