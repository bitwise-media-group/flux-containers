#
# flux-containers consumes the shared toolchain (bitwise-media-group/toolchain)
# as the .mise/ submodule: mise loads its config.toml natively as
# .mise/config.toml (the pinned tools and the [vars] knob defaults), and this
# file selects the task files. The containers archetype carries the pipeline
# surface (`patchy mirror` behind the mirror-* tasks) and every tool it needs —
# patchy, crane, yq, cosign, grype, kubescape — as shared pins, so this repo
# pins nothing of its own. tasks.toml adds the docs site's chart reference
# pages; the Makefile is a thin forwarder
# (.mise/archetypes/containers/include.mk).

[settings]
lockfile = true
locked = false
minimum_release_age = "3d"

[task_config]
# common (prose fmt/lint + license, container, shell and workflow lint), then
# the containers archetype (the mirror-* pipeline tasks and the fmt, lint,
# build, ci and pr rollups), then the repo-local docs site tasks; tasks.toml is
# included LAST so its same-named tasks (pr) win over both.
includes = [".mise/common/tasks.toml", ".mise/archetypes/containers/tasks.toml", "tasks.toml"]
