apiVersion: mirror.patchy.bitwisemedia.uk/v1alpha1
kind: Chart
name: aws-load-balancer-controller
chart:
  repo: https://aws.github.io/eks-charts
  name: aws-load-balancer-controller
  version: "3.5.0"
  versionConstraint: ">=3.5.0 <4.0.0"
  # Declare the chart's upstream provenance; provider: none documents a
  # verification gap rather than hiding it.
  verifyUpstream:
    provider: none
discovery:
  namespace: aws-load-balancer-controller
  valuesFiles: [values/discovery.yaml]
  kubeVersion: "1.34.0"
images:
  extra: []
  exclude: []
  # Every locked image must match a rule; first match wins. Replace the
  # catch-all below with real provenance rules where upstream signs.
  verifyUpstream:
    - match: "*"
      provider: none
scan:
  failOn: [CRITICAL, HIGH]
  ignoreUnfixed: true
  allowlist:
    # Blocking findings are machine-transcribed into security/allowlist.yaml
    # by `patchy mirror upgrade`; the PR review is where the risk is accepted.
    generate: true
    preamble: |
      aws-load-balancer-controller images are released in lockstep with the
      chart (one version stream), so an entry here means no fixed
      aws-load-balancer-controller release exists yet; the chart upgrade is
      what clears it.

# publish:
#   # Override the default publish path (<chartNamespace>/<name>), applied
#   # under every registry URL.
#   chartRepo: charts/example
