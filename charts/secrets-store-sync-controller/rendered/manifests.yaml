---
# Source: secrets-store-sync-controller/templates/secrets-store-sync-controller.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-store-sync-controller-manager
  namespace: secret-sync
  labels:
    app.kubernetes.io/component: manager
    app.kubernetes.io/created-by: secrets-store-sync-controller
    control-plane: controller-manager
    app.kubernetes.io/name: deployment
    app.kubernetes.io/part-of: secrets-store-sync-controller
    app.kubernetes.io/instance: controller-manager
    secrets-store.io/system: "true"
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      secrets-store.io/system: "true"
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app: secrets-store-sync-controller
        control-plane: controller-manager
        secrets-store.io/system: "true"
    spec:
      nodeSelector:
        kubernetes.io/os: linux
        role: system
      tolerations:
        - operator: Exists
      affinity:
        null
      containers:
      - name: manager
        image: registry.k8s.io/secrets-store-sync/controller:v0.0.5
        imagePullPolicy: IfNotPresent
        args:
        - --provider-volume=/provider
        - --token-request-audience=pods.eks.amazonaws.com
        - --health-probe-bind-address=:8081
        - --metrics-bind-address=:8085
        - --leader-elect
        - --rotation-poll-interval=12h
        env:
          - name: SYNC_CONTROLLER_POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: SYNC_CONTROLLER_POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
          - name: SYNC_CONTROLLER_POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
        ports:
        - name: metrics
          containerPort: 8085
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        command:
        - /secrets-store-sync-controller
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts:
        - mountPath: "/provider"
          name: providervol
      serviceAccountName: "secrets-store-sync-controller-manager"
      terminationGracePeriodSeconds: 10
      volumes:
      - name: providervol
        hostPath:
          path: "/var/run/secrets-store-sync-providers"
          type: DirectoryOrCreate

