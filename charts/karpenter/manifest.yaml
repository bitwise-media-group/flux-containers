apiVersion: mirror.patchy.bitwisemedia.uk/v1alpha1
kind: Chart
name: karpenter
chart:
  # Karpenter's AWS provider: node auto-provisioning for EKS workload capacity
  # (flux-manifests' aws-only `karpenter` component). This is the full chart —
  # it ships the karpenter.sh / karpenter.k8s.aws CRDs in crds/ — so the
  # separate karpenter-crd chart is not mirrored.
  repo: oci://public.ecr.aws/karpenter
  name: karpenter
  version: "1.15.1"
  versionConstraint: ">=1.15.1 <2.0.0"
  # aws/karpenter-provider-aws keyless-signs the OCI chart from its tag-push
  # release workflow (SAN https://github.com/aws/karpenter-provider-aws/
  # .github/workflows/release.yaml@refs/tags/v<version>), stored as a legacy
  # .sig tag beside the chart.
  verifyUpstream:
    provider: cosign-keyless
    certificateIdentityRegexp: "^https://github.com/aws/karpenter-provider-aws/\\.github/workflows/release\\.yaml@refs/tags/v"
    certificateOidcIssuer: "https://token.actions.githubusercontent.com"
discovery:
  # kube-system: the namespace terraform-aws-eks-flux's Pod Identity
  # association binds the controller's ServiceAccount in
  # (workload_identity.karpenter.namespace) and where the platform deploys it.
  namespace: kube-system
  valuesFiles: [values/discovery.yaml]
  kubeVersion: "1.34.0"
images:
  # No track rules: the controller is the only image and it is versioned in
  # lockstep with the chart (tag = appVersion, digest pinned in the chart's
  # values), so the chart pin is what moves it. The v1 chart has no separate
  # webhook image.
  extra: []
  exclude: []
  verifyUpstream:
    # Same release workflow, same identity as the chart above.
    - match: "public.ecr.aws/karpenter/*"
      provider: cosign-keyless
      certificateIdentityRegexp: "^https://github.com/aws/karpenter-provider-aws/\\.github/workflows/release\\.yaml@refs/tags/v"
      certificateOidcIssuer: "https://token.actions.githubusercontent.com"
scan:
  failOn: [CRITICAL, HIGH]
  ignoreUnfixed: true
  allowlist:
    # Blocking findings are machine-transcribed into security/allowlist.yaml
    # by `patchy mirror upgrade`; the PR review is where the risk is accepted.
    generate: true
    preamble: |
      The karpenter controller image is released in lockstep with the chart
      (one version stream), so an entry here means no fixed karpenter release
      exists yet; the chart upgrade is what clears it.
publish:
  chartRepo: charts/karpenter
