apiVersion: mirror.patchy.bitwisemedia.uk/v1alpha1
kind: Chart
name: renovate
chart:
  repo: oci://ghcr.io/renovatebot/charts
  name: renovate
  version: "46.251.0"
  versionConstraint: ">=46.251.0 <47.0.0"
  # Declare the chart's upstream provenance; provider: none documents a
  # verification gap rather than hiding it.
  verifyUpstream:
    provider: none
discovery:
  namespace: renovate
  valuesFiles: [values/discovery.yaml]
  kubeVersion: "1.34.0"
images:
  extra: []
  exclude: []
  # Every locked image must match a rule; first match wins.
  verifyUpstream:
    # renovatebot/renovate images are keyless-signed by the "release" job in
    # build.yml (id-token: write, sigstore/cosign-installer) on push to
    # main/next/maint/**. The bundle is attached via OCI referrers rather
    # than a .sig tag; cosign v3 resolves it either way. No GitHub
    # build-provenance attestation is published for this image (the
    # Attestations API 404s) — only the cosign signature.
    - match: "ghcr.io/renovatebot/renovate:*"
      provider: cosign-keyless
      certificateIdentityRegexp: "^https://github.com/renovatebot/renovate/"
      certificateOidcIssuer: "https://token.actions.githubusercontent.com"
scan:
  failOn: [CRITICAL, HIGH]
  ignoreUnfixed: true
  allowlist:
    # Blocking findings are machine-transcribed into security/allowlist.yaml
    # by `patchy mirror upgrade`; the PR review is where the risk is accepted.
    generate: true
    preamble: |
      The scanned image is built upstream, so an entry means no fixed
      image exists yet.

