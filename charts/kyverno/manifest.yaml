apiVersion: mirror.patchy.bitwisemedia.uk/v1alpha1
kind: Chart
name: kyverno
chart:
  repo: oci://ghcr.io/kyverno/charts
  name: kyverno
  version: "3.9.0"
  versionConstraint: ">=3.8.0 <4.0.0"
  verifyUpstream:
    provider: cosign-keyless
    certificateIdentityRegexp: "^https://github.com/kyverno/kyverno/"
    certificateOidcIssuer: "https://token.actions.githubusercontent.com"
    # kyverno publishes signatures to a dedicated repository, not next to the artifact.
    signatureRepository: ghcr.io/kyverno/signatures
discovery:
  namespace: kyverno
  valuesFiles: [values/discovery.yaml]
  kubeVersion: "1.34.0"
images:
  # No track rules: kyverno images are versioned in lockstep with the chart
  # (tags = appVersion); the chart pin is what moves them.
  extra: []
  exclude:
    # helm test hook pod on a mutable `latest` tag; tests never run under flux.
    - pattern: "ghcr.io/kyverno/readiness-checker:*"
  verifyUpstream:
    # kyverno 1.18+ references its images via the reg.kyverno.io vanity registry.
    - match: "reg.kyverno.io/kyverno/*"
      provider: cosign-keyless
      certificateIdentityRegexp: "^https://github.com/kyverno/kyverno/"
      certificateOidcIssuer: "https://token.actions.githubusercontent.com"
      signatureRepository: ghcr.io/kyverno/signatures
    - match: "ghcr.io/kyverno/*"
      provider: cosign-keyless
      certificateIdentityRegexp: "^https://github.com/kyverno/kyverno/"
      certificateOidcIssuer: "https://token.actions.githubusercontent.com"
      signatureRepository: ghcr.io/kyverno/signatures
scan:
  failOn: [CRITICAL, HIGH]
  ignoreUnfixed: true
  allowlist:
    # Blocking findings are machine-transcribed into security/allowlist.yaml
    # by `patchy mirror upgrade`; the PR review is where the risk is accepted.
    generate: true
    preamble: |
      Kyverno images are released in lockstep with the chart, so an entry
      means no fixed kyverno release exists yet. Historically the findings
      come from the sigstore/notation verification stack the images
      bundle.
publish:
  chartRepo: charts/kyverno
