# Values used to render the chart for review and image discovery.
# Keep this the closest thing to how the platform actually deploys it.

hubble:
  tls:
    # Helm's default auto-generation (hubble.tls.auto.method=helm) mints a
    # fresh CA and server certificate on every render, which makes the
    # rendered manifest non-deterministic and breaks mirror validation.
    # Point the agent at an externally managed Secret instead so no
    # certificate material is rendered at all.
    auto:
      enabled: false
    server:
      existingSecret: hubble-server-certs
  # The relay and UI run at runtime (flux-manifests, fronted by the
  # auth-proxy component), so their three images must be mirrored. The
  # relay's client certificate points at an existing Secret for the same
  # determinism reason as the agent's server certificate above.
  relay:
    enabled: true
    tls:
      client:
        existingSecret: hubble-relay-client-certs
  ui:
    enabled: true
