#
# Discovery-only values — LOAD-BEARING here: the chart refuses to render
# without mode, and the runtime (flux-manifests) deploys the -contrib image
# (the googlecloud / googlemanagedprometheus exporters only exist there), so
# discovery must mirror that exact image.
#
# The tag below is FACT, not intent: Renovate bumps it through the
# `# renovate:` annotation (newest contrib 0.x tag, the .images.track rule in
# manifest.yaml) and `patchy mirror upgrade` re-picks it locally — never
# hand-edit it. Without the pin the chart falls back to its appVersion, which
# lags contrib image releases.
mode: deployment
image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  # renovate: datasource=docker depName=ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  tag: 0.163.1
