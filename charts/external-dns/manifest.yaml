apiVersion: mirror.patchy.bitwisemedia.uk/v1alpha1
kind: Chart
name: external-dns
chart:
  # https repo: kubernetes-sigs publishes no OCI chart yet
  # (kubernetes-sigs/external-dns#4630); tgzs are GitHub release assets behind
  # the gh-pages index. Unsigned — documented gap.
  repo: https://kubernetes-sigs.github.io/external-dns/
  name: external-dns
  version: "1.21.1"
  versionConstraint: ">=1.15.0 <2.0.0"
  verifyUpstream:
    provider: none
discovery:
  namespace: external-dns
  valuesFiles: [values/discovery.yaml]
  kubeVersion: "1.34.0"
images:
  # external-dns images release on their own train; the chart's appVersion
  # can lag them. The track rule re-picks the newest soaked v0.x tag on every
  # `patchy mirror upgrade` and writes it into valuesPath below, irrespective
  # of chart movement. No versionConstraint: patchy derives the pinned tag's
  # own release train (>=pin <1.0.0). The tag line in values/discovery.yaml
  # is FACT — never hand-edit it.
  track:
    - image: registry.k8s.io/external-dns/external-dns
      valuesPath: .image.tag
  extra: []
  exclude: []
  verifyUpstream:
    # registry.k8s.io images are keyless-signed by the kubernetes release
    # promoter. If signature serving regresses for this path (the 2026 image
    # signature routing change), downgrade to provider: none with a comment.
    - match: "registry.k8s.io/external-dns/*"
      provider: cosign-keyless
      certificateIdentityRegexp: "^krel-trust@k8s-releng-prod\\.iam\\.gserviceaccount\\.com$"
      certificateOidcIssuer: "https://accounts.google.com"
scan:
  failOn: [CRITICAL, HIGH]
  ignoreUnfixed: true
  allowlist:
    # Blocking findings are machine-transcribed into security/allowlist.yaml
    # by `patchy mirror upgrade`; the PR review is where the risk is accepted.
    generate: true
    preamble: |
      Single-binary Go image tracked by images.track; entries are Go
      module / stdlib lag in the newest external-dns image — no fixed
      release exists yet.
publish:
  chartRepo: charts/external-dns
