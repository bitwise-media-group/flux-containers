#
# Discovery-only values: enable anything whose images must be mirrored, even
# when a given cluster's runtime values (in flux-manifests) leave it off.
# Runtime values do NOT live here.
#
# The platform's auth-proxy component keeps sessions in cookies, never in
# the redis-ha subchart, so neither redis nor the alpine wait-for-redis init
# container (both default off) ever runs; nothing outside oauth2-proxy's own
# image may reach the mirror for this chart. The credentials come from an
# existing Secret at runtime, so the chart renders no placeholder Secret
# here either.
config:
  existingSecret: oauth2-proxy
