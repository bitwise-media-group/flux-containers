apiVersion: mirror.patchy.bitwisemedia.uk/v1alpha1
kind: Chart
name: gha-runner-scale-set
chart:
  # One half of Actions Runner Controller: this chart is the *scale set* (an
  # AutoscalingRunnerSet CR plus its RBAC). It is inert on its own — the
  # AutoscalingRunnerSet CRD, the controller itself and the listener image all
  # ship in the sibling `gha-runner-scale-set-controller` chart, which the
  # lockstep group below keeps on the same version. A cluster needs both.
  repo: oci://ghcr.io/actions/actions-runner-controller-charts
  name: gha-runner-scale-set
  # Released together with gha-runner-scale-set-controller on one version
  # stream, and ARC does not support running a scale set against a different
  # controller version — the lockstep group makes update-check bump both in
  # one PR.
  lockstep: arc
  version: "0.15.1"
  versionConstraint: ">=0.14.0 <1.0.0"
  # actions/actions-runner-controller publishes the OCI charts unsigned: no
  # .sig tag and no sigstore bundle among the artifact's referrers — documented
  # gap. The runner image below is keyless-verified.
  verifyUpstream:
    provider: none
discovery:
  namespace: arc-runners
  valuesFiles: [values/discovery.yaml]
  kubeVersion: "1.34.0"
images:
  # The runner image rides its own release train (actions/runner 2.x), which
  # says nothing about this chart's version — so `chart.version` can't imply
  # it and the chart's own default is the mutable `:latest`. `patchy mirror
  # upgrade` picks the newest tag that has cleared the cooldown and writes it
  # into valuesPath below; `make mirror-upgrade` and the daily update-check workflow
  # re-pick it. The pinned line in values/discovery.yaml is FACT — never
  # hand-edit it.
  track:
    - image: ghcr.io/actions/actions-runner
      versionConstraint: ">=2.320.0 <3.0.0"
      # cooldownDays inherits patchy.yaml mirror.update.cooldownDays (3).
      valuesFile: values/discovery.yaml
      valuesPath: .template.spec.containers[0].image
  extra: []
  exclude: []
  verifyUpstream:
    # actions/runner keyless-signs the runner image from its release workflow
    # (SAN e.g. https://github.com/actions/runner/.github/workflows/release.yml
    # @refs/heads/releases/m336 — the branch varies per release train, so match
    # on the repo prefix). The signature is a sigstore bundle attached via OCI
    # referrers rather than a .sig tag; cosign v3 resolves it either way.
    - match: "ghcr.io/actions/actions-runner:*"
      provider: cosign-keyless
      certificateIdentityRegexp: "^https://github.com/actions/runner/"
      certificateOidcIssuer: "https://token.actions.githubusercontent.com"
    # containerMode dind's sidecar. The chart hardcodes `docker:dind` (no value
    # overrides it), so the lock pins whatever digest the moving `dind` tag
    # resolved to at update time, and the mirror serves it under that same tag.
    # Docker Official Images carry no cosign signature (no .sig tag, no
    # sigstore bundle among the referrers) — documented gap; the mirror's
    # signature is the first provenance this image gets.
    - match: "docker.io/library/docker:*"
      provider: none
scan:
  failOn: [CRITICAL, HIGH]
  ignoreUnfixed: true
  allowlist:
    # The runner image bumps on its own cadence (.images.track above), and each
    # bump rewrites the finding set — hand-transcribing 30-odd CVE entries per
    # bump is not review, it is dictation. `patchy mirror upgrade` regenerates the
    # file from the scan; the PR is where the risk is actually accepted.
    generate: true
    # Whole-file context for reviewers. Per-finding analysis goes in a `notes`
    # field on the entry itself, which regeneration preserves verbatim.
    preamble: |
      Re-reviewed for containerMode dind (values/discovery.yaml): the scale set
      now runs a privileged docker:dind sidecar beside the runner, so the DinD
      toolchain is no longer latent. Every entry is a *bundled* dependency of
      something the two images ship, not of the runner binary itself, in one of
      three groups:

        1. The Docker-in-Docker toolchain — REACHABLE. In the docker:dind
           sidecar, dockerd and containerd run (privileged) and ctr and
           docker-buildx are present; in the runner image, the docker CLI and
           /usr/local/lib/docker/cli-plugins/docker-buildx now drive that daemon
           (the runner's own /usr/bin/dockerd, containerd and ctr stay unused —
           the daemon is the sidecar's, so the grpc-go, go-jose and x/text
           findings, which only those runner binaries carry, stay latent). The
           Go stdlib and golang.org/x/net findings are mostly HTTP/2 and HTTP/1
           server-side denial-of-service bugs: dockerd listens only on a unix
           socket in a pod-local emptyDir shared with the runner container, so
           the only peer is the job's own workflow code, which already runs
           arbitrary code in the same ephemeral pod and can at worst stall its
           own daemon. The
           moby/go-archive path escape (buildx) is reached through
           workflow-supplied build contexts and images, and writes inside the
           same ephemeral pod. None of these widens what a dind job can already
           do: a workflow with the docker socket is root on its node through
           the privileged sidecar regardless, which is why dind scale sets run
           on isolated, scale-to-zero capacity of their own. Accepting these is
           accepting that isolation, not the absence of reachability.
        2. The npm CLI's own vendored node_modules and the bundled Node
           runtimes themselves (/home/runner/externals/node20|node24). Reachable
           only when a workflow invokes node or npm, and always as
           workflow-controlled code inside the ephemeral runner pod.
        3. Ubuntu base packages in the runner image (libbrotli1, also bundled
           by node). These deserve a closer look than the two groups above;
           each one carries a per-entry note.
publish:
  chartRepo: charts/gha-runner-scale-set
