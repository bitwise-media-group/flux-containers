---
# Source: gha-runner-scale-set/templates/autoscalingrunnerset.yaml
apiVersion: actions.github.com/v1alpha1
kind: AutoscalingRunnerSet
metadata:
  name: gha-runner-scale-set
  namespace: arc-runners
  labels:
    app.kubernetes.io/component: "autoscaling-runner-set"
    helm.sh/chart: gha-rs-0.15.1
    app.kubernetes.io/name: gha-runner-scale-set
    app.kubernetes.io/instance: gha-runner-scale-set
    app.kubernetes.io/version: "0.15.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gha-rs
    actions.github.com/scale-set-name: gha-runner-scale-set
    actions.github.com/scale-set-namespace: arc-runners
  annotations:
    actions.github.com/values-hash: f7b3e6f8d3fab9fbee9c6affe64d19b38ea604b0a30d1e022b781f352808596
    actions.github.com/cleanup-manager-role-binding: gha-runner-scale-set-gha-rs-manager
    actions.github.com/cleanup-manager-role-name: gha-runner-scale-set-gha-rs-manager
    actions.github.com/cleanup-no-permission-service-account-name: gha-runner-scale-set-gha-rs-no-permission

spec:
  githubConfigUrl: https://github.com/bitwise-media-group
  githubConfigSecret: gha-runner-scale-set-github-config
  listenerConfig:
    scaler:
      burst: 100
      qps: 50

  template:
    spec:
      restartPolicy: Never
      serviceAccountName: gha-runner-scale-set-gha-rs-no-permission
      initContainers:
      - args:
        - -r
        - /home/runner/externals/.
        - /home/runner/tmpDir/
        command:
        - cp
        image: ghcr.io/actions/actions-runner:2.338.2
        name: init-dind-externals
        volumeMounts:
        - mountPath: /home/runner/tmpDir
          name: dind-externals
      - args:
        - dockerd
        - --host=unix:///var/run/docker.sock
        - --group=$(DOCKER_GROUP_GID)
        env:
        - name: DOCKER_GROUP_GID
          value: "123"
        image: docker.io/library/docker:29.9.3-dind
        name: dind
        restartPolicy: Always
        securityContext:
          privileged: true
        startupProbe:
          exec:
            command:
            - docker
            - info
          failureThreshold: 24
          initialDelaySeconds: 0
          periodSeconds: 5
        volumeMounts:
        - mountPath: /home/runner/_work
          name: work
        - mountPath: /var/run
          name: dind-sock
        - mountPath: /home/runner/externals
          name: dind-externals
      containers:
      
      - name: runner
        command: 
          - /home/runner/run.sh
        image: 
          ghcr.io/actions/actions-runner:2.338.2
        env:
          - 
            name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          - 
            name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
            value: "120"
        volumeMounts:
          - 
            mountPath: /home/runner/_work
            name: work
          - 
            mountPath: /var/run
            name: dind-sock
      volumes:
      - emptyDir: {}
        name: dind-sock
      - emptyDir: {}
        name: dind-externals
      - emptyDir: {}
        name: work
